<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF0F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A" letter-spacing="1">命令行学习方式的演变</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#6B7280">从纸面手册到 AI 智能体协作</text>

  <!-- Timeline line -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="80" y1="260" x2="700" y2="260" stroke="#8B8B8B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Node 1: 1974 -->
  <circle cx="130" cy="260" r="18" fill="#3B82F6"/>
  <circle cx="130" cy="260" r="14" fill="white"/>
  <circle cx="130" cy="260" r="10" fill="#3B82F6"/>
  <text x="130" y="264" text-anchor="middle" font-size="9" fill="white" font-weight="700">1</text>

  <text x="130" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">1974</text>
  <text x="130" y="330" text-anchor="middle" font-size="11" fill="#6B7280">Kernighan 写首篇</text>
  <text x="130" y="345" text-anchor="middle" font-size="11" fill="#6B7280">Unix 入门教程</text>

  <rect x="75" y="130" width="110" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="130" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#3B82F6">啃手册</text>
  <text x="130" y="168" text-anchor="middle" font-size="10" fill="#6B7280">二十多页从头教</text>
  <text x="130" y="183" text-anchor="middle" font-size="10" fill="#6B7280">出错只能干瞪眼</text>
  <text x="130" y="198" text-anchor="middle" font-size="10" fill="#6B7280">没有互联网</text>

  <line x1="130" y1="210" x2="130" y2="242" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 2: 2008 -->
  <circle cx="310" cy="260" r="18" fill="#8B5CF6"/>
  <circle cx="310" cy="260" r="14" fill="white"/>
  <circle cx="310" cy="260" r="10" fill="#8B5CF6"/>
  <text x="310" y="264" text-anchor="middle" font-size="9" fill="white" font-weight="700">2</text>

  <text x="310" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">2008</text>
  <text x="310" y="330" text-anchor="middle" font-size="11" fill="#6B7280">Stack Overflow</text>
  <text x="310" y="345" text-anchor="middle" font-size="11" fill="#6B7280">Google 时代</text>

  <rect x="255" y="130" width="110" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="310" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#8B5CF6">搜论坛</text>
  <text x="310" y="168" text-anchor="middle" font-size="10" fill="#6B7280">学会"正确提问"</text>
  <text x="310" y="183" text-anchor="middle" font-size="10" fill="#6B7280">翻多个标签页</text>
  <text x="310" y="198" text-anchor="middle" font-size="10" fill="#6B7280">等回复</text>

  <line x1="310" y1="210" x2="310" y2="242" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 3: 2022 -->
  <circle cx="490" cy="260" r="18" fill="#10B981"/>
  <circle cx="490" cy="260" r="14" fill="white"/>
  <circle cx="490" cy="260" r="10" fill="#10B981"/>
  <text x="490" y="264" text-anchor="middle" font-size="9" fill="white" font-weight="700">3</text>

  <text x="490" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">2022</text>
  <text x="490" y="330" text-anchor="middle" font-size="11" fill="#6B7280">ChatGPT 发布</text>
  <text x="490" y="345" text-anchor="middle" font-size="11" fill="#6B7280">AI 问答时代</text>

  <rect x="435" y="130" width="110" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="490" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">自然语言问</text>
  <text x="490" y="168" text-anchor="middle" font-size="10" fill="#6B7280">直接给命令</text>
  <text x="490" y="183" text-anchor="middle" font-size="10" fill="#6B7280">即时解答</text>
  <text x="490" y="198" text-anchor="middle" font-size="10" fill="#6B7280">报错贴进去就好</text>

  <line x1="490" y1="210" x2="490" y2="242" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 4: 现在 -->
  <circle cx="670" cy="260" r="18" fill="#F59E0B"/>
  <circle cx="670" cy="260" r="14" fill="white"/>
  <circle cx="670" cy="260" r="10" fill="#F59E0B"/>
  <text x="670" y="264" text-anchor="middle" font-size="9" fill="white" font-weight="700">4</text>

  <text x="670" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">现在</text>
  <text x="670" y="330" text-anchor="middle" font-size="11" fill="#6B7280">OpenClaw 等</text>
  <text x="670" y="345" text-anchor="middle" font-size="11" fill="#6B7280">AI 智能体协作</text>

  <rect x="615" y="130" width="110" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="670" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#F59E0B">直接操作</text>
  <text x="670" y="168" text-anchor="middle" font-size="10" fill="#6B7280">AI 在终端里跑命令</text>
  <text x="670" y="183" text-anchor="middle" font-size="10" fill="#6B7280">查日志、管文件</text>
  <text x="670" y="198" text-anchor="middle" font-size="10" fill="#6B7280">人机协作界面</text>

  <line x1="670" y1="210" x2="670" y2="242" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Footer note -->
  <text x="400" y="400" text-anchor="middle" font-size="10" fill="#9CA3AF">学习曲线被大幅拉平 — 从啃手册到 AI 智能体直接协作</text>
</svg>
