<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8B8B8B"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F9FA"/>
      <stop offset="100%" stop-color="#EEF0F2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" rx="8"/>

  <!-- Title -->
  <text x="400" y="45" text-anchor="middle" font-size="20" font-weight="700" fill="#1A1A1A" letter-spacing="1">命令行学习方式的演变</text>
  <text x="400" y="68" text-anchor="middle" font-size="13" fill="#6B7280">从手册到 AI 助手</text>

  <!-- Timeline line -->
  <line x1="80" y1="260" x2="720" y2="260" stroke="#D1D5DB" stroke-width="2"/>
  <line x1="80" y1="260" x2="700" y2="260" stroke="#8B8B8B" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

  <!-- Node 1: 1974 -->
  <circle cx="160" cy="260" r="22" fill="#3B82F6"/>
  <circle cx="160" cy="260" r="18" fill="white"/>
  <circle cx="160" cy="260" r="14" fill="#3B82F6"/>
  <text x="160" y="264" text-anchor="middle" font-size="11" fill="white" font-weight="700">1</text>

  <!-- Node 1: label -->
  <text x="160" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">1974</text>
  <text x="160" y="330" text-anchor="middle" font-size="11" fill="#6B7280">Kernighan 写首篇</text>
  <text x="160" y="345" text-anchor="middle" font-size="11" fill="#6B7280">Unix 入门教程</text>

  <!-- Node 1: description box -->
  <rect x="95" y="130" width="130" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="160" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#3B82F6">啃手册</text>
  <text x="160" y="168" text-anchor="middle" font-size="10" fill="#6B7280">二十多页从头教</text>
  <text x="160" y="183" text-anchor="middle" font-size="10" fill="#6B7280">出错只能干瞪眼</text>
  <text x="160" y="198" text-anchor="middle" font-size="10" fill="#6B7280">没有互联网</text>

  <!-- Connector line -->
  <line x1="160" y1="210" x2="160" y2="238" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 2: 2008 -->
  <circle cx="400" cy="260" r="22" fill="#8B5CF6"/>
  <circle cx="400" cy="260" r="18" fill="white"/>
  <circle cx="400" cy="260" r="14" fill="#8B5CF6"/>
  <text x="400" y="264" text-anchor="middle" font-size="11" fill="white" font-weight="700">2</text>

  <text x="400" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">2008</text>
  <text x="400" y="330" text-anchor="middle" font-size="11" fill="#6B7280">Stack Overflow 上线</text>
  <text x="400" y="345" text-anchor="middle" font-size="11" fill="#6B7280">Google 时代</text>

  <rect x="335" y="130" width="130" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="400" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#8B5CF6">搜论坛</text>
  <text x="400" y="168" text-anchor="middle" font-size="10" fill="#6B7280">学会"正确提问"</text>
  <text x="400" y="183" text-anchor="middle" font-size="10" fill="#6B7280">翻多个标签页</text>
  <text x="400" y="198" text-anchor="middle" font-size="10" fill="#6B7280">等回复</text>

  <line x1="400" y1="210" x2="400" y2="238" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Node 3: 2022 -->
  <circle cx="640" cy="260" r="22" fill="#10B981"/>
  <circle cx="640" cy="260" r="18" fill="white"/>
  <circle cx="640" cy="260" r="14" fill="#10B981"/>
  <text x="640" y="264" text-anchor="middle" font-size="11" fill="white" font-weight="700">3</text>

  <text x="640" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#1A1A1A">2022</text>
  <text x="640" y="330" text-anchor="middle" font-size="11" fill="#6B7280">ChatGPT 发布</text>
  <text x="640" y="345" text-anchor="middle" font-size="11" fill="#6B7280">AI 时代开启</text>

  <rect x="575" y="130" width="130" height="80" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1"/>
  <text x="640" y="152" text-anchor="middle" font-size="11" font-weight="600" fill="#10B981">自然语言问</text>
  <text x="640" y="168" text-anchor="middle" font-size="10" fill="#6B7280">直接给命令</text>
  <text x="640" y="183" text-anchor="middle" font-size="10" fill="#6B7280">即时解答</text>
  <text x="640" y="198" text-anchor="middle" font-size="10" fill="#6B7280">报错贴进去就好</text>

  <line x1="640" y1="210" x2="640" y2="238" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Footer note -->
  <text x="400" y="400" text-anchor="middle" font-size="10" fill="#9CA3AF">学习曲线被大幅拉平 — 不是命令行变简单了，而是获得帮助的路径变短了</text>
</svg>
