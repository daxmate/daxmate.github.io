<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" width="740" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" fill="#64748b">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="740" height="520" fill="#f8fafc" rx="8"/>

  <!-- Title -->
  <text x="370" y="34" text-anchor="middle" font-size="18" font-weight="650" fill="#172033">LaTeX 编译就用 latexmk</text>
  <text x="370" y="54" text-anchor="middle" font-size="12" fill="#5b6475">一句话配置 · 自动化编译</text>

  <!-- Central hub -->
  <rect x="285" y="110" width="170" height="70" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="370" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">~ / .latexmkrc</text>
  <text x="370" y="162" text-anchor="middle" font-size="11" fill="#94a3b8">Perl 配置文件</text>

  <!-- Connection lines from center -->
  <line x1="370" y1="180" x2="370" y2="210" stroke="#64748b" stroke-width="1.5"/>

  <!-- Category 1: Engine Selection -->
  <rect x="60" y="86" width="180" height="100" rx="8" fill="#e0f2fe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">⌨️ 编译引擎</text>
  <line x1="75" y1="115" x2="225" y2="115" stroke="#93c5fd" stroke-width="1"/>

  <text x="75" y="134" font-size="11" fill="#1e3a8a">$pdf_mode = 1 → pdflatex</text>
  <text x="75" y="151" font-size="11" fill="#1e3a8a">$pdf_mode = 4 → lualatex</text>
  <text x="75" y="168" font-size="11" fill="#1e3a8a">$pdf_mode = 5 → xelatex（推荐中文）</text>

  <line x1="240" y1="136" x2="285" y2="136" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Category 2: Compiler Flags -->
  <rect x="500" y="86" width="180" height="100" rx="8" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/>
  <text x="590" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#581c87">⚙️ 编译参数</text>
  <line x1="515" y1="115" x2="665" y2="115" stroke="#d8b4fe" stroke-width="1"/>

  <text x="515" y="134" font-size="11" fill="#4a1d96">-synctex=1</text>
  <text x="515" y="151" font-size="11" fill="#4a1d96">-interaction=nonstopmode</text>
  <text x="515" y="168" font-size="11" fill="#4a1d96">-file-line-error</text>

  <line x1="455" y1="136" x2="500" y2="136" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Category 3: Output Directory -->
  <rect x="60" y="222" width="180" height="80" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="150" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#166534">📁 输出目录</text>
  <line x1="75" y1="251" x2="225" y2="251" stroke="#bbf7d0" stroke-width="1"/>

  <text x="75" y="270" font-size="11" fill="#14532d">$out_dir = 'build'</text>
  <text x="75" y="288" font-size="11" fill="#14532d">$aux_dir = 'build'</text>

  <line x1="240" y1="262" x2="285" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Category 4: PDF Viewer -->
  <rect x="500" y="222" width="180" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="590" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">👁️ PDF 预览器</text>
  <line x1="515" y1="251" x2="665" y2="251" stroke="#fde68a" stroke-width="1"/>

  <text x="515" y="270" font-size="11" fill="#78350f">$pdf_previewer =</text>
  <text x="515" y="288" font-size="11" fill="#78350f">'open -a Skim'</text>

  <line x1="455" y1="262" x2="500" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Category 5: Cleanup -->
  <rect x="280" y="226" width="180" height="72" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="370" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">🧹 清理规则</text>
  <line x1="295" y1="255" x2="445" y2="255" stroke="#fca5a5" stroke-width="1"/>

  <text x="295" y="274" font-size="11" fill="#7f1d1d">@generated_exts</text>
  <text x="295" y="290" font-size="11" fill="#7f1d1d">$clean_ext</text>

  <line x1="285" y1="262" x2="280" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="455" y1="262" x2="460" y2="262" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Usage zone at bottom -->
  <rect x="120" y="360" width="500" height="56" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="370" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#0369a1">日常使用：一条命令</text>
  <text x="370" y="404" text-anchor="middle" font-family="monospace" font-size="15" fill="#1e40af">latexmk -pvc -pdf main.tex</text>

  <!-- Extras -->
  <rect x="120" y="440" width="500" height="56" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="370" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">两个常用辅助命令</text>
  <text x="200" y="483" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">latexmk -C</text>
  <text x="350" y="483" text-anchor="middle" font-size="12" fill="#64748b">清理全部中间文件</text>
  <text x="540" y="483" text-anchor="middle" font-family="monospace" font-size="13" fill="#64748b">latexmk -g</text>
  <text x="650" y="483" text-anchor="middle" font-size="12" fill="#64748b">强制完整重跑</text>
</svg>
