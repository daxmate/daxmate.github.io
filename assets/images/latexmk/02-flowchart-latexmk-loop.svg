<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" width="700" height="560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#64748b">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto" fill="#22c55e">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="700" height="560" fill="#f8fafc" rx="8"/>

  <text x="350" y="34" text-anchor="middle" font-size="18" font-weight="650" fill="#172033">latexmk 智能编译决策流程</text>

  <!-- Start -->
  <ellipse cx="350" cy="72" rx="72" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="350" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#1e3a8a">开始编译</text>

  <line x1="350" y1="94" x2="350" y2="118" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Run LaTeX engine -->
  <rect x="230" y="122" width="240" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="350" y="150" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">运行 LaTeX 引擎</text>

  <line x1="350" y1="166" x2="350" y2="190" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Scan .log -->
  <rect x="230" y="194" width="240" height="44" rx="8" fill="#c7d2fe" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="350" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#3730a3">扫描 .log 文件</text>

  <line x1="350" y1="238" x2="350" y2="262" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Decision diamond -->
  <polygon points="350,266 480,318 350,370 220,318" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="350" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#854d0e">有 "Rerun" 提示？</text>

  <!-- NO → Done (right exit) -->
  <line x1="480" y1="318" x2="540" y2="318" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow-right)"/>
  <text x="510" y="310" font-size="12" font-weight="600" fill="#15803d">否</text>

  <ellipse cx="590" cy="318" rx="60" ry="22" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
  <text x="590" y="324" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">编译完成</text>

  <!-- YES → run auxiliary tools (left exit from diamond) -->
  <line x1="220" y1="318" x2="140" y2="318" stroke="#ca8a04" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="310" font-size="12" font-weight="600" fill="#854d0e">是</text>

  <rect x="50" y="296" width="90" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="314" text-anchor="middle" font-size="11" fill="#78350f">检查是否需要</text>
  <text x="95" y="330" text-anchor="middle" font-size="11" fill="#78350f">Biber/BibTeX</text>

  <!-- Arrow down to run auxiliary -->
  <line x1="95" y1="340" x2="95" y2="375" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Run auxiliary -->
  <rect x="5" y="380" width="180" height="44" rx="8" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="95" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">运行 Biber / BibTeX</text>
  <text x="95" y="415" text-anchor="middle" font-size="11" fill="#a16207">/ Makeindex（按需）</text>

  <!-- Loop back: both paths merge here -->
  <line x1="95" y1="424" x2="95" y2="450" stroke="#64748b" stroke-width="1.5"/>
  <line x1="95" y1="450" x2="350" y2="450" stroke="#64748b" stroke-width="1.5"/>
  <line x1="350" y1="450" x2="350" y2="170" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="250" y="442" text-anchor="middle" font-size="12" fill="#64748b">重新运行 LaTeX，直到没有 "Rerun" 提示</text>

  <!-- Max iterations guard -->
  <rect x="450" y="260" width="210" height="36" rx="6" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/>
  <text x="555" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">已达最大编译次数（默认 5~10）</text>

  <!-- Trigger strings panel -->
  <rect x="435" y="395" width="240" height="100" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="555" y="415" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">.log 中检查的触发字符串</text>
  <text x="445" y="435" font-size="10" fill="#64748b">Rerun to get cross-references</text>
  <text x="445" y="452" font-size="10" fill="#64748b">Rerun to get citations correct</text>
  <text x="445" y="469" font-size="10" fill="#64748b">Label(s) may have changed</text>
  <text x="445" y="486" font-size="10" fill="#64748b">Please rerun LaTeX (biblatex)</text>

  <!-- PVC note -->
  <rect x="100" y="510" width="500" height="36" rx="6" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350" y="533" text-anchor="middle" font-size="12" fill="#0369a1">💡 -pvc 模式：保存源文件后自动触发流程，只跑必要的次数</text>
</svg>
